<!DOCTYPE html>

<html>

<head>
    <meta name="viewport" content="width=device-width" />
    <title>Hive Connect</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./loginPage.css" />
</head>

<body>

    <div class="main-container">
        <div class="left-panel-container">
            <div class="left-panel-inner">
                <img src="./img/phillipsmorris.png" class="logo" />
                <img src="./img/hivelogo.svg" class="logo" />
                <div style="height: 100%; display: flex; flex-direction: column; justify-content: flex-start">
                    <section id="login">
                        <div>
                            <h2>
                                Sign in to your account
                            </h2>

                            <!-- <div class="button-link-container">
                                <a class="button-link-primary" href="#">
                                    Continue with SSO
                                </a>
                            </div>
                            <div style="margin-top: 1rem">
                                <p>
                                    Or continue with your login details
                                </p>
                            </div> -->

                            <form action="">
                                <div class="text-input-container">
                                    <input placeholder="Username" class="text-input" type="text" />
                                    <span class="error-text field-validation-valid"></span>
                                </div>
                                <div class="text-input-container">
                                    <div class="password_eye">
                                        <input placeholder="Password" class="text-input" type="password" name="Password" />
                                        <i class="fas fa-eye-slash toggle-password"></i>
                                    </div>
                                    <span class="error-text field-validation-valid"></span>
                                </div>

                                <!-- <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
                                    <a class="button-link-text" href="#">Forgotten Username</a>&nbsp;
                                    <a class="button-link-text" href="#">/ Password?</a>
                                </div>

                                <div style="display: flex; align-items: center">
                                    <input class="checkbox-input" type="checkbox" id="rememberLogin" />
                                    <label for="rememberLogin">
                                        Remember me
                                    </label>
                                </div> -->

                                <button class="button-primary" type="submit" name="button" value="login">
                                    Login
                                </button>
                                <div style="margin-bottom: 1rem; text-align: right;font-size: 14px;">
                                    <!-- No account yet?

                                    <a class="button-link-text" href="#">Register</a> -->
                                </div>
                            </form>
                        </div>
                    </section>
                </div>

                <footer>
                    <!-- <div class="exchange">
                        <h4>Powered by <b>&nbsp;Hive</b>Connect</h4>
                        <p>Copyright @Hive Software Group 2022 | All rights reserved</p>
                    </div> -->
                    
                    <img src="./img/exchange.svg" alt="not found" />
                </footer>
            </div>
        </div>
        <div class="image-container"></div>

    </div>

</body>

</html>
