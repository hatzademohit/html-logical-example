<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-div{
            align-content: center;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .main-div div{
            padding: 25px;
            background-color: #ccc;
            height: 200px;
            width: calc(25% - 60px);
            align-items: center;
            text-align: center;

            h1{
                width: 0px;
            }
        }
    </style>
</head>
<body>
    <div class="main-div">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
    </div>
</body>
</html>
