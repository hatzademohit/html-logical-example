<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./dist/css/bootstrap-multiselect.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="table-responsive">
        <table class="table border">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Mohit</td>
                    <td>
                        <select name="name" class="multiselect d-none" multiple="multiple">
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="30">30</option>
                            <option value="40">40</option>
                        </select>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="./dist/js/bootstrap-multiselect.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>
    
<script>
    $('.multiselect').multiselect({
        includeSelectAllOption: true,
        enableFiltering: true,
        maxHeight: 250,
        // buttonContainer: '<body />',
        onDropdownShown: function(e) {
            // $(e.target).css('color',  'red');
            var buttonPosition = $('.dropdown-toggle').offset();
            var top = buttonPosition.top
            var left = buttonPosition.left
            setTimeout(() => {
                $('.multiselect-container').css({
                    top: top + 37,
                    left: left,
                    position: 'fixed',
                    transform: 'unset'
                })
            });
            console.log(top , " " , left)
        }
    });
</script>
</body>
</html>
