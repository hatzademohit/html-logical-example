<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .radio-div, .label-div{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .radio-div label{
            margin-right: 10px;
        }
        .label-div div{
            position: relative;
            margin-left: 35px;
        }
        .label-div div::before{
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #000000;
            left: -35px;
        }
        .label-div div:first-child:before{
            background-color: #1b1c4c;
        }
        .label-div div:last-child:before{
            background-color: #417ac1;
        }
    </style>
  
</head>
<body>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>


    <div class="d-flex justify-content-center align-items-center radio-div">
        <input type="radio" id="pcr" name="data">
        <label for="pcr">pcr.com</label>

        <input type="radio" id="social_categories" name="data">
        <label for="social_categories">Social Categories</label>

        <input type="radio" id="brand" name="data">
        <label for="brand">Brand</label>

        <input type="radio" id="promotinal" name="data">
        <label for="promotinal">Promotinal</label>
    </div>

    <div class="d-flex justify-content-center align-items-center label-div">
        <div>Assigned Category</div>
        <div>Unassigned Category</div>
    </div>

    <figure class="highcharts-figure">
        <div id="container"></div>
    </figure>


    <script>
        Highcharts.chart('container', {
            chart: {
                type: 'pie',
                custom: {},
            },
            accessibility: {
                point: {
                    valueSuffix: '%'
                }
            },
            tooltip: {
                pointFormat: '{series.name}: <b>{point.percentage:.0f}%</b>'
            },
            legend: {
                enabled: false
            },
            exporting: {
                enabled: false
            },
            title: {
                text: null
            },
            credits: {
                enabled: false
            },
            plotOptions: {
                series: {
                    allowPointSelect: true,
                    cursor: 'pointer',
                    borderRadius: 0,
                    dataLabels: [{
                        enabled: true,
                        distance: 0,
                        format: '{point.name}'
                    }, {
                        enabled: true,
                        distance: 0,
                        format: '{point.percentage:.0f}%',
                        style: {
                            fontSize: '0.9em'
                        }
                    }],
                    showInLegend: true
                }
            },
            series: [{
                name: 'Product Counts',
                colorByPoint: true,
                innerSize: '60%',
                data: [{
                    name: '',
                    y: 85,
                    color: '#1b1c4c'
                }, {
                    name: '',
                    y: 15,
                    color: '#417ac1'
                }]
            }]
        });

    </script>

</body>
</html>
