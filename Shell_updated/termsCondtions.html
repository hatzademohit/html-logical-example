<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/stylesheet.css">
    <link rel="stylesheet" href="css/responsive.css">
    <title>Terms & Conditions</title>
</head>
<body>
   

<div class="information-wrap terms-conditons">
    <h1>Terms & Conditions</h1>
    <p class="title">These terms and conditions outline the rules and regulations for the use of our website.
    </p>
</div>

<div class="sign-up-content">
    <h3>Like Being First?</h3>
    <p>Connect with us to receive new arrival and special offers before anyone else</p>
    <div class="email-input-section">
        <div class="sign-up-input-div d-flex justify-content-between align-items-center">
            <div>
                <input type="text" class="sign-up-input" name="newsletter" id="newsletter" placeholder="Email" autocomplete="off">
            </div>
            <div>
                <button type="submit" id="newsletter_btn" class="sign-up-btn">Sign Up</button>
            </div>
        </div>
    </div>
</div>

    
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

</html>
